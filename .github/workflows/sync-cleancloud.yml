name: Sync CleanCloud orders

# Vercel's Hobby plan only allows cron jobs to run once a day, which is far
# too slow for feedback requests / loyalty credits that should follow an
# order within minutes. GitHub Actions has no such limit, so it drives the
# polling instead — this workflow just calls our own endpoint on a
# schedule; all the real logic lives in app/api/cron/sync-cleancloud.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Call sync-cleancloud endpoint
        env:
          FEEDBACK_API_SECRET: ${{ secrets.FEEDBACK_API_SECRET }}
        run: |
          # Strip any stray whitespace/newlines from the secret (a common
          # copy-paste artifact in GitHub's secret UI) before it goes into
          # the URL — a raw newline there breaks curl with "URL malformed".
          CLEAN_SECRET=$(printf '%s' "$FEEDBACK_API_SECRET" | tr -d '[:space:]')
          curl -sf "https://www.haadlinks.com/api/cron/sync-cleancloud?secret=${CLEAN_SECRET}&windowSeconds=1800" \
            -o response.json -w "HTTP %{http_code}\n"
          cat response.json
